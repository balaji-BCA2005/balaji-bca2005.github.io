<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Balaji's Portfolio with Logo ..</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,600&display=swap" rel="stylesheet">
  <style>
    body { margin:0; font-family:'Inter',sans-serif; background:linear-gradient(180deg,#0f1724,#071022); color:#e6eef6; }
    header { background:#0b1220; padding:24px 0 16px 0; }
    .wrap{ max-width:1100px; margin:28px auto; padding:20px;}
    nav { display:flex; justify-content:space-between; align-items:center; }
    .logo { font-weight:bold; color:#06b6d4; font-size:22px; }
    nav ul { display:flex; gap:18px; list-style:none; }
    nav ul li a { color:#e6eef6; text-decoration:none; font-weight:600; }
    nav ul li a:hover { color:#06b6d4; }
    .hero { text-align:center; margin:36px 0; }
    .hero button { background:#06b6d4; color:#0b1220; border:none; padding:12px 26px; border-radius:8px; font-size:16px;}
    section { margin:44px auto; max-width:800px;}
    h2 { color:#06b6d4; margin-bottom:18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:20px;}
    .card { background:#0b1220; border-radius:10px; overflow:hidden; box-shadow:0 8px 30px rgba(2,6,23,0.3); cursor:pointer; transition:transform .1s; padding-bottom:8px; position:relative;}
    .card:hover { transform:translateY(-6px); box-shadow:0 12px 40px rgba(6,182,212,.13);}
    .card .img { height:110px; display:flex; align-items:center; justify-content:center; background:#06b6d4;}
    .card .img img { width:100%; height:110px; object-fit:cover; border-radius:10px 10px 0 0;}
    .card .img span {color:#fff; font-size:22px; font-weight:bold;}
    .card h3 { margin:10px 6px 4px 6px;}
    .card p { color:#94a3b8; margin:0 8px 10px 8px; font-size:14px;}
    .meta { margin:0 0 12px 8px; display:flex; gap:6px; align-items:center;}
    .openbtn { border-radius:6px; padding:4px 12px; border:none; font-weight:600; font-size:13px; cursor:pointer; background:#06b6d4; color:#071022; }
    .modal { display:none; position:fixed; z-index:900; left:0; top:0; width:100vw; height:100vh; background:rgba(15,23,36,0.86);}
    .modal-content { background:#181e2b; margin:100px auto; padding:32px 24px; border-radius:12px; width:90%; max-width:480px; position:relative;}
    .close { position:absolute; top:16px; right:22px; color:#06b6d4; font-size:36px; cursor:pointer;}
    @media(max-width:600px){.grid{grid-template-columns:1fr;}.wrap{padding:4px;}.modal-content{padding:18px 8px;}}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <nav>
        <span class="logo">Balaji</span>
        <ul>
          <li><a href="#projects">Projects</a></li>
        </ul>
      </nav>
      <div class="hero">
        <h1>Hi, I'm Balaji</h1>
        <p>Website Devolopment l React Devoloper l Frontend Devolopment</p>
        <button onclick="window.location='#projects'">View Projects</button>
      </div>
    </div>
  </header>
  <main>
    <div class="wrap">
      <!-- Projects grid -->
      <section>
        <h2 id="projects">My Projects</h2>
        <div id="grid" class="grid" aria-live="polite"></div>
        <div id="emptyMsg" style="color:#94a3b8;font-size:15px;margin-top:12px;display:none;">No projects yet — please add manually in code.</div>
      </section>
    </div>
    <!-- Modal for project details - not used in this version -->
    <div id="modal" class="modal">
      <div class="modal-content" id="modal-content"></div>
    </div>
  </main>
  <footer style="text-align:center; color:#94a3b8; margin-top:32px;">
    © 2025 Balaji | All rights reserved.
  </footer>
  <script>
    const grid = document.getElementById('grid');
    const emptyMsg = document.getElementById('emptyMsg');

  const projects = [
  {
    title: "Clock Digital",
    url: "https://balaji-bca2005.github.io/clock.github.io/",
    desc: "A simple analog/digital clock project.",
    logo: "https://balaji-bca2005.github.io/home/clock.png"
  },
  {
    title: "Door Shop",
    url: "https://balaji-bca2005.github.io/door.github.io/",
    desc: "A simple door shop Web-Design",
    logo: "D.png"
  }
    
];


    function render(list){
      grid.innerHTML = '';
      if(!list || list.length === 0){
        emptyMsg.style.display='block';
        return;
      }
      emptyMsg.style.display='none';
      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';

        const img = document.createElement('div');
        img.className = 'img';
        if(p.logo){
          img.innerHTML = `<img src="${p.logo}" alt="Project Logo">`;
        }else{
          img.innerHTML = `<span>${p.title ? p.title.charAt(0).toUpperCase() : "P"}</span>`;
        }
        card.appendChild(img);

        const h3 = document.createElement('h3');
        h3.textContent = p.title || p.url;
        card.appendChild(h3);

        const desc = document.createElement('p');
        desc.textContent = p.desc || '';
        card.appendChild(desc);

        const meta = document.createElement('div');
        meta.className = 'meta';

        const open = document.createElement('button');
        open.className = "openbtn";
        open.textContent = "Open";
        open.onclick = (e) => { e.stopPropagation(); window.open(p.url, '_blank'); };

        meta.appendChild(open);
        card.appendChild(meta);

        grid.appendChild(card);
      });
    }

    render(projects);
  </script>
</body>
</html>
